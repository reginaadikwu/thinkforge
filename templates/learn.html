<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn - ThinkForge</title>
</head>
<body>

    <h1>Welcome to ThinkForge</h1>
    <h2>I'm Forge, your mentor.</h2>
    <p>Before we begin, let's get to know you.</p>

    <form action="/learn" method="POST">
        <label for="name">What is your name?</label>

        <input
            type="text"
            id="name"
            name="learnerName"
            placeholder="Your name..."
        >

        <button type="submit">Let's Go! </button>
    </form>

</body>
</html>
